name: Shellcheck

on:
  push:
    paths:
      - wan-cve-audit.sh
      - .github/workflows/shellcheck.yml
  pull_request:
    paths:
      - wan-cve-audit.sh
      - .github/workflows/shellcheck.yml

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run shellcheck
        run: shellcheck wan-cve-audit.sh
